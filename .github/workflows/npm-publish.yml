name: npm publish (disabled)

# The upstream tokentracker-cli npm package and Homebrew tap are not owned by
# TokenTracker-Community. Publishing remains unavailable until the fork has its
# own package identity and release process.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Explain disabled publication
        run: |
          echo "::error::The Community fork does not publish the upstream npm package."
          exit 1
