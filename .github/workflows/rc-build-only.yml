name: Community build-only RC

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/rc-build-only.yml'
      - '.github/workflows/ci.yml'
      - 'scripts/rc/**'
      - 'scripts/prepare-release-client-config.cjs'
      - 'scripts/validate-versions.cjs'
      - 'package*.json'
      - 'bin/**'
      - 'src/**'
      - 'dashboard/**'
      - 'TokenTrackerWin/**'
      - 'TokenTrackerBar/**'
      - 'TokenTrackerLinux/**'

permissions:
  contents: read

concurrency:
  group: rc-build-only-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  RC_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
  VITE_INSFORGE_BASE_URL: ${{ vars.TOKENTRACKER_COMMUNITY_INSFORGE_BASE_URL }}
  VITE_INSFORGE_ANON_KEY: ${{ secrets.TOKENTRACKER_COMMUNITY_INSFORGE_ANON_KEY }}

jobs:
  candidate:
    if: github.repository == 'baozibao728-cmd/TokenTracker-Community' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.changes.outputs.build }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - run: node scripts/rc/checkout.cjs
      # PR paths inspect the whole PR, so use this push's before/head range too.
      # Documentation-only synchronize events must not rebuild all three clients.
      - id: changes
        env:
          RC_COMPARE_SHA: ${{ github.event.before || github.event.pull_request.base.sha }}
        run: node scripts/rc/changes.cjs

  windows:
    needs: candidate
    if: needs.candidate.outputs.build == 'true' && github.repository == 'baozibao728-cmd/TokenTracker-Community' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Verify exact candidate and release configuration
        run: |
          node scripts/rc/checkout.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Candidate checkout check failed.' }
          node scripts/validate-versions.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Version check failed.' }
          node scripts/prepare-release-client-config.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Client configuration check failed.' }
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Pin .NET 8 SDK without cross-major roll-forward
        shell: pwsh
        run: |
          $sdkVersion = dotnet --list-sdks | ForEach-Object { ($_ -split ' ')[0] } |
            Where-Object { $_ -match '^8\.0\.\d+$' } | Sort-Object { [version]$_ } | Select-Object -Last 1
          if (-not $sdkVersion) { throw '.NET 8 SDK missing.' }
          dotnet new globaljson --sdk-version $sdkVersion --roll-forward disable
          if ($LASTEXITCODE -ne 0 -or (dotnet --version).Trim() -ne $sdkVersion) { throw 'Wrong SDK selected.' }
          dotnet --info
      - name: Build Dashboard including Windows pet entry
        env:
          TOKENTRACKER_BUILD_PET: '1'
        run: |
          npm ci --prefix dashboard --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Dashboard install failed.' }
          npm run dashboard:build
          if ($LASTEXITCODE -ne 0) { throw 'Dashboard build failed.' }
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ttnode-22.22.2
          key: node-win-x64-22.22.2
      - name: Bundle, publish, package and inspect Windows delivery
        shell: pwsh
        env:
          NODE_CACHE_DIR: ${{ runner.temp }}/ttnode-22.22.2
        run: ./scripts/rc/windows.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: rc-windows-${{ github.event.pull_request.head.sha }}
          path: build/rc/windows/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  macos:
    needs: candidate
    if: needs.candidate.outputs.build == 'true' && github.repository == 'baozibao728-cmd/TokenTracker-Community' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Verify exact candidate and release configuration
        run: |
          set -euo pipefail
          node scripts/rc/checkout.cjs
          node scripts/validate-versions.cjs
          node scripts/prepare-release-client-config.cjs
      - name: Build Dashboard
        run: |
          set -euo pipefail
          npm ci --prefix dashboard --no-audit --no-fund
          npm run dashboard:build
      - uses: actions/cache@v4
        with:
          path: /tmp/node-cache
          key: node-darwin-universal-22.22.2
      - name: Bundle universal EmbeddedServer
        env:
          NODE_CACHE_DIR: /tmp/node-cache
        run: bash TokenTrackerBar/scripts/bundle-node.sh
      - name: Install packaging tools
        run: brew install xcodegen create-dmg
      - name: Release build, ad-hoc sign and inspect mounted DMG
        run: bash scripts/rc/macos.sh
      - uses: actions/upload-artifact@v7
        with:
          name: rc-macos-${{ github.event.pull_request.head.sha }}
          path: build/rc/macos/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  linux:
    needs: candidate
    if: needs.candidate.outputs.build == 'true' && github.repository == 'baozibao728-cmd/TokenTracker-Community' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            dashboard/package-lock.json
            TokenTrackerLinux/package-lock.json
      - name: Verify exact candidate and release configuration
        run: |
          set -euo pipefail
          node scripts/rc/checkout.cjs
          node scripts/validate-versions.cjs
          node scripts/prepare-release-client-config.cjs
      - name: Install formal build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev pkg-config desktop-file-utils fuse3 rpm cpio libarchive-tools
          npm ci --no-audit --no-fund
          npm ci --prefix dashboard --no-audit --no-fund
          npm ci --prefix TokenTrackerLinux --no-audit --no-fund
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: TokenTrackerLinux/src-tauri
      - name: Build Dashboard and Linux packages
        run: |
          set -euo pipefail
          npm run dashboard:build
          npm --prefix TokenTrackerLinux run bundle:node
          npm --prefix TokenTrackerLinux run build
      - name: Inspect each AppImage, deb and rpm payload
        run: bash scripts/rc/linux.sh
      - uses: actions/upload-artifact@v7
        with:
          name: rc-linux-${{ github.event.pull_request.head.sha }}
          path: build/rc/linux/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  delivery:
    needs: [windows, macos, linux]
    if: github.repository == 'baozibao728-cmd/TokenTracker-Community' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/rc/checkout.cjs
      # Download the actual uploaded packages before assembling final checksums.
      - uses: actions/download-artifact@v8
        with:
          pattern: rc-*-${{ github.event.pull_request.head.sha }}
          path: build/rc/downloads
          digest-mismatch: error
      - name: Check uploaded bytes and assemble six-package delivery
        run: node scripts/rc/artifacts.cjs assemble build/rc/downloads build/rc/delivery "$RC_SOURCE_SHA"
      - uses: actions/upload-artifact@v7
        with:
          name: community-rc-${{ github.event.pull_request.head.sha }}
          path: build/rc/delivery/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
